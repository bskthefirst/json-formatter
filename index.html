<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON Formatter - Free Online Tool</title>
<meta name="description" content="Free online JSON formatter, validator, and beautifier.">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0d1117;color:#c9d1d9;min-height:100vh;display:flex;flex-direction:column}
header{background:#161b22;padding:16px 24px;border-bottom:1px solid #30363d;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:18px;font-weight:600;color:#f0f6fc}
main{flex:1;display:flex;flex-direction:column;gap:16px;padding:24px;max-width:1200px;margin:0 auto;width:100%}
.ad-frame{width:100%;text-align:center;padding:12px 0}
textarea{width:100%;min-height:300px;background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:16px;color:#c9d1d9;font-family:monospace;font-size:14px;resize:vertical}
textarea:focus{outline:none;border-color:#58a6ff}
.btn-row{display:flex;gap:12px;flex-wrap:wrap}
button{background:#238636;color:#fff;border:none;padding:10px 20px;border-radius:6px;font-size:14px;font-weight:500;cursor:pointer}
button:hover{background:#2ea043}
button.secondary{background:#21262d;border:1px solid #30363d}
button.secondary:hover{background:#30363d}
#error{color:#f85149;padding:12px 16px;background:#3d0d0d;border:1px solid #f85149;border-radius:8px;display:none}
footer{text-align:center;padding:24px;color:#8b949e;font-size:12px;border-top:1px solid #30363d}
</style>
</head>
<body>
<header><h1>JSON Formatter</h1><span style="color:#8b949e;font-size:12px">Free Online Tool</span></header>
<div class="ad-frame">
<iframe data-aa="2437272" src="//acceptable.a-ads.com/2437272?size=Adaptive" style="border:0;padding:0;width:70%;height:auto;overflow:hidden;display:block;margin:auto"></iframe>
</div>
<main>
<div class="btn-row">
<button onclick="format()">Beautify</button>
<button onclick="minify()">Minify</button>
<button class="secondary" onclick="clearAll()">Clear</button>
<button class="secondary" onclick="copyOut()">Copy Result</button>
</div>
<textarea id="input" placeholder="Paste your JSON here..."></textarea>
<div id="error"></div>
<textarea id="output" readonly placeholder="Formatted JSON will appear here..."></textarea>
</main>
<div class="ad-frame">
<iframe data-aa="2437272" src="//acceptable.a-ads.com/2437272?size=Adaptive" style="border:0;padding:0;width:70%;height:auto;overflow:hidden;display:block;margin:auto"></iframe>
</div>
<footer>Built with love | Share this tool</footer>
<script>
function format(){
  const raw=document.getElementById('input').value.trim();
  const err=document.getElementById('error');
  const out=document.getElementById('output');
  if(!raw){out.value='';err.style.display='none';return}
  try{const obj=JSON.parse(raw);out.value=JSON.stringify(obj,null,2);err.style.display='none'}
  catch(e){err.textContent='Invalid JSON: '+e.message;err.style.display='block';out.value=''}
}
function minify(){
  const raw=document.getElementById('input').value.trim();
  const err=document.getElementById('error');
  const out=document.getElementById('output');
  if(!raw){out.value='';err.style.display='none';return}
  try{const obj=JSON.parse(raw);out.value=JSON.stringify(obj);err.style.display='none'}
  catch(e){err.textContent='Invalid JSON: '+e.message;err.style.display='block';out.value=''}
}
function clearAll(){document.getElementById('input').value='';document.getElementById('output').value='';document.getElementById('error').style.display='none'}
function copyOut(){const o=document.getElementById('output');if(!o.value)return;navigator.clipboard.writeText(o.value).then(()=>alert('Copied!'))}
</script>
</body>
</html>
